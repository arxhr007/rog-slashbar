[package]
name = "rog-slashbar"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-only"
description = "ASUS ROG Slash light bar as a live Claude Code dashboard: agent state, usage limits, burn rate"
repository = "https://github.com/arxhr007/rog-slashbar"
readme = "README.md"

[dependencies]
hidapi = "2"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
